[unstable]
json-target-spec = true
build-std-features =["compiler-builtins-mem"]
panic-abort-tests = true
build-std = ["core", "compiler_builtins", "alloc"]

[target.x86_64-palladiumos]
runner = "bootimage runner"
# The kernel (and the test kernels) live in the top 2 GiB: the "kernel"
# code model. (The userland uses the same target, but build.rs gives it
# its own flags through CARGO_ENCODED_RUSTFLAGS, which take precedence.)
rustflags = ["-Ccode-model=kernel", "-Crelocation-model=static", "-Clink-arg=--image-base=0xffffffff80000000"]

[env]
RUST_TARGET_PATH = { value = ".", relative = true }
CARGO_BUILD_TARGET = { value = "x86_64-palladiumos.json" }

[build]
target ="x86_64-palladiumos.json"

