[package]
name = "palladiumos"
version = "0.4.0"
edition = "2024"

[package.metadata.bootimage]
test-timeout = 300 # (seconds)
# The ext2 data disk (created by build.rs) is attached as the second IDE disk.
run-args = ["-drive", "format=raw,file=target/disk.img,index=1,media=disk"]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio",
    "-display", "none",
    "-drive", "format=raw,file=target/test-disk.img,index=1,media=disk"
]
test-success-exit-code = 33     # (0x10 << 1 | 1

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"]}
volatile = "0.2.6"
spin = "0.5.2"
# step_trait is left out: it no longer compiles on current nightly (Step trait changed)
x86_64 = { version = "0.14.2", default-features = false, features = ["instructions", "abi_x86_interrupt", "const_fn"] }
uart_16550 = "0.6.0"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"
fatfs = { git = "https://github.com/rafalh/rust-fatfs", default-features = false, features = ["alloc"] }
[dependencies.crossbeam-queue]
version = "0.3.11"
default-features = false
features = ["alloc"]

[dependencies.conquer-once]
version = "0.2.0"
default-features = false

[dependencies.futures-util]
version = "0.3.4"
default-features = false
features = ["alloc"]

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name ="palladiumos"
test = true
bench = false
