[package]
name = "palladiumos"
version = "0.6.9"
edition = "2024"

# The kernel lives in the higher half (it's linked at 0xffffffff80000000,
# see .cargo/config.toml), so the whole lower half is for programs.
# (QEMU's arguments for cargo run and cargo test are in tools/runner.)

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[dependencies]
# The kernel's side of the bootloader (bootloader 0.11: BIOS or UEFI, a
# framebuffer). tools/runner builds the bootable disk images.
bootloader_api = "0.11.17"
# The console's font (pre-rendered Noto Sans Mono, 9x16).
noto-sans-mono-bitmap = { version = "0.2", default-features = false, features = ["regular", "size_16", "unicode-basic-latin"] }
# TCP/IP (no_std): Ethernet, IPv4, ARP, DHCP, TCP, UDP, ICMP.
smoltcp = { version = "0.14", default-features = false, features = [
    "alloc", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-dhcpv4",
    "proto-ipv6", "proto-ipv6-slaac", # IPv6, its address from router advertisements
    "socket-tcp", "socket-udp", "socket-icmp", "socket-dhcpv4", "socket-raw",
    "auto-icmp-echo-reply", # answer pings
] }
spin = "0.5.2"
# step_trait is left out: it no longer compiles on current nightly (Step trait changed)
x86_64 = { version = "0.14.2", default-features = false, features = ["instructions", "abi_x86_interrupt", "const_fn"] }
uart_16550 = "0.6.0"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"
fatfs = { git = "https://github.com/rafalh/rust-fatfs", default-features = false, features = ["alloc"] }
[dependencies.crossbeam-queue]
version = "0.3.11"
default-features = false
features = ["alloc"]

[dependencies.conquer-once]
version = "0.2.0"
default-features = false

[dependencies.futures-util]
version = "0.3.4"
default-features = false
features = ["alloc"]

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[profile.dev]
panic = "abort"
# Optimized, but with debug checks (overflow checks, assertions, the kernel
# stack canary): cargo run and the tests are several times faster than
# unoptimized code. Release kernels: cargo build --release (images: see
# tools/runner).
opt-level = 2

[profile.release]
panic = "abort"

[[bin]]
name ="palladiumos"
test = true
bench = false
